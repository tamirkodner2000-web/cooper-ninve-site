<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="description" content="" />
    <title>תצוגה מקדימה | קופר נינוה</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      /* Preview-only chrome. The landing content itself uses styles.css classes
         so it matches the public landing page. Nothing here leaks to the site. */
      .preview-bar {
        position: sticky;
        top: 0;
        z-index: 2000;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
        padding: 10px 20px;
        background: #2b1a4d;
        color: #fff;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.5;
        border-bottom: 2px solid #c9a45b;
      }
      .preview-bar__tag {
        font-weight: 800;
        letter-spacing: .04em;
        background: #c9a45b;
        color: #22162f;
        padding: 3px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .preview-bar__meta { display: flex; flex-wrap: wrap; gap: 6px 16px; opacity: .92; }
      .preview-bar__meta b { font-weight: 500; opacity: .7; }
      .preview-bar details { margin-inline-start: auto; }
      .preview-bar summary { cursor: pointer; opacity: .85; }
      .preview-bar__seo {
        margin: 8px 0 0;
        padding: 10px 12px;
        background: rgba(255, 255, 255, .08);
        border-radius: 8px;
        max-width: 620px;
      }
      .preview-bar__seo p { margin: 0 0 6px; }
      .preview-bar__seo p:last-child { margin-bottom: 0; }

      .preview-state {
        max-width: 640px;
        margin: 12vh auto;
        padding: 32px 28px;
        text-align: center;
        font-size: 16px;
        line-height: 1.7;
      }
      .preview-state h1 { font-size: 26px; margin: 0 0 12px; }
      .preview-state p { margin: 0 0 8px; color: #4a5568; }
      .preview-state__en { font-size: 14px; opacity: .7; direction: ltr; }
      .preview-state--error h1 { color: #a12c2c; }
      .preview-spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 18px;
        border: 3px solid rgba(43, 26, 77, .18);
        border-top-color: #2b1a4d;
        border-radius: 50%;
        animation: preview-spin .9s linear infinite;
      }
      @keyframes preview-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .preview-spinner { animation-duration: 3s; }
      }

      /* CTA whose destination the API cannot resolve. Rendered inert, never as a link. */
      .preview-cta-unresolved {
        opacity: .55;
        cursor: not-allowed;
        text-decoration: line-through;
      }
      .preview-cta-flag {
        display: block;
        font-size: 11px;
        font-style: normal;
        letter-spacing: 0;
        text-decoration: none;
        opacity: .85;
      }
      .preview-empty {
        margin: 0;
        padding: 10px 14px;
        border: 1px dashed rgba(43, 26, 77, .35);
        border-radius: 8px;
        color: #6b7280;
        font-size: 14px;
      }
      .preview-form-note { font-size: 13px; color: #6b7280; margin: 6px 0 0; }
    </style>
  </head>
  <body class="lang-he lp">
    <div data-preview-bar></div>
    <main id="main" data-preview-app>
      <div class="preview-state">
        <div class="preview-spinner"></div>
        <h1>טוען תצוגה מקדימה…</h1>
        <p class="preview-state__en">Loading preview…</p>
      </div>
    </main>
    <div data-preview-sticky></div>
    <script src="/preview.js" defer></script>
  </body>
</html>
